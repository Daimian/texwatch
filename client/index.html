<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>texwatch</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
           background: #4a4a4a; color: #eee; }
    #status { position: sticky; top: 0; z-index: 10; padding: 8px 12px;
              background: #2b2b2b; border-bottom: 1px solid #000; display: flex;
              gap: 12px; align-items: center; flex-wrap: wrap; }
    #status.ok    { border-bottom-color: #3d8b40; }
    #status.error { border-bottom-color: #c0392b; background: #3a2422; }
    #status.compiling { border-bottom-color: #b8860b; }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex: none; }
    .ok #dot { background: #4caf50; } .error #dot { background: #e74c3c; }
    .compiling #dot { background: #f0ad4e; }
    #summary { font-weight: 600; }
    #stale { color: #f0ad4e; }
    label { margin-left: auto; display: flex; gap: 6px; align-items: center; cursor: pointer; }
    #diagnostics { max-height: 30vh; overflow-y: auto; padding: 0 12px 8px;
                   background: #2b2b2b; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    #diagnostics:empty { display: none; }
    .diag { padding: 4px 0; border-top: 1px solid #3a3a3a; }
    .diag .loc { color: #6ab0f3; }
    .diag.error .msg { color: #ff8a80; }
    .diag.warning .msg { color: #ffd180; }
    .diag .hint { color: #9e9e9e; white-space: pre-wrap; }
    #pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #pages:empty::before {
      content: "还没有编译出的 PDF"; color: #999; padding: 40px 0;
    }
    canvas { box-shadow: 0 2px 12px rgba(0,0,0,.5); background: #fff; max-width: 100%; }
  </style>
</head>
<body>
  <div id="status">
    <span id="dot"></span>
    <span id="summary">连接中…</span>
    <span id="stale"></span>
    <label><input type="checkbox" id="draft"> draft（图片画空框，更快）</label>
  </div>
  <div id="diagnostics"></div>
  <div id="pages"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
